schema_version: 1
recipe:
  name: airdcpp-webclient
  upstream_version: "2.14.0"
  cvc_revision: 1
  maintainer: "cy-pca"
  maintainer_url: "https://github.com/cy-pca/airdcpp-webclient"
  homepage: https://airdcpp-web.github.io/
  # The daemon is GPL-3.0-or-later, per its source headers: airdcpp-core and airdcpp-webapi say
  # "version 3 ... or (at your option) any later version", airdcppd/ "version 2 ... or any later
  # version", so the program as a whole is GPL-3.0-or-later. Upstream's tree carries no licence
  # file, so the recipe ships the GPL-3.0 text (GPL-3.0.txt here, from the FSF). The bundled Web
  # UI (airdcpp-webui) is MIT.
  license: "GPL-3.0-or-later AND MIT"
  tags: [networking, p2p, direct-connect, daemon, web]
  description: >-
    The AirDC++ web client 2.14.0, a Direct Connect (NMDC and ADC) client run as a daemon and
    used through a browser or its HTTP and WebSocket API, built from upstream's source with its
    Web UI (airdcpp-webui 2.14.0) as upstream's portable build bundles it. `airdcppd
    -c=DIR --add-user`, `--configure` and a plain `airdcppd -c=DIR` work from the prefix;
    bin/airdcppd points the daemon at the prefix's web resources. Linux and macOS.

# Upstream source: https://github.com/airdcpp-web/airdcpp-webclient, tag 2.14.0 (32b222b). This
# recipe lives in the cy-pca/airdcpp-webclient fork, which carries no source changes, so it builds
# upstream's own tag. If the fork ever needs a source patch, it lands on the fork's master through
# a pull request, gets a tag there, and this url and sha256 move to that tag.
source:
  type: tarball
  url: https://github.com/airdcpp-web/airdcpp-webclient/archive/refs/tags/2.14.0.tar.gz
  sha256: "ca1f0d134968e5b4272efd6125fb51747aa8d35ca4ea20536e4a02aa95e79d5e"
  strip_components: 1

patches: []

depends:
  build:
    - cmake
    - ninja
    # Runs upstream's version and string-table generators.
    - python312
    # Copied to share/airdcpp/web-resources/.
    - name: airdcpp-webui
      version: "==2.14.0"
    # Header-only, compiled in.
    - name: websocketpp
      version: "==0.8.2"
    - name: nlohmann-json
  runtime:
    - name: boost
    - name: openssl
    - name: zlib
    - name: bzip2
    - name: miniupnpc
    - name: leveldb
    - name: libmaxminddb
    # macOS's libc has no iconv, so upstream's find_package(Iconv) links a library: cvcpkg's.
    - { name: iconv, platforms: [macos] }
  host_tools: []

build:
  matrix:
    - platform: linux
      script: build.sh
    # arm64 (Apple Silicon); 13.0 is the deployment target of cvcpkg's macOS bundles.
    - platform: macos
      script: build.sh
      env:
        MACOSX_DEPLOYMENT_TARGET: "13.0"

package:
  files:
    - bin/airdcppd
    - libexec/airdcpp-webclient/airdcppd
    - lib/libairdcpp*
    - share/airdcpp/web-resources/
    - share/licenses/airdcpp-webclient/

test:
  script: test.sh

abi:
  cxx_std: 20

toolchain:
  note: >-
    GCC 12 or newer on Linux (upstream's floor; C++20), Apple clang (Xcode 16) on macOS.
    Everything else is a cvcpkg package: build.sh runs cmake, ninja and python (python312, for
    upstream's version and string-table generators) from the build or dependency prefix and
    stops if they are missing there. The Web UI is not
    compiled: cvcpkg's airdcpp-webui is the published npm package's dist/, the same files
    upstream's own install step copies.

notes:
  - title: "bin/airdcppd is a launcher"
    description: >-
      The daemon is libexec/airdcpp-webclient/airdcppd. Upstream compiles the web resource
      directory in as an absolute path, which would point into the build machine once the bundle
      is unpacked elsewhere, so bin/airdcppd runs it with --web-resources set to the prefix's
      share/airdcpp/web-resources/ (unless the command line already sets it) and passes every
      other argument through. Settings go where upstream puts them: -c=DIR, else ~/.airdc++/.
      On macOS, upstream's CMake installs the daemon as an application bundle (airdcppd.app) and
      its two libraries inside another one; build.sh moves them into the same libexec/ and lib/
      layout as on Linux.
  - title: "Web UI from cvcpkg's airdcpp-webui"
    description: >-
      airdcpp-webui 2.14.0 is the package upstream's INSTALL_WEB_UI step fetches with npm;
      cvcpkg packages its dist/ (share/airdcpp-webui/), and build.sh copies it into this bundle's
      share/airdcpp/web-resources/, so the build needs no npm or network. INSTALL_WEB_UI stays off.
  - title: "Optional features off"
    description: >-
      NAT-PMP (libnatpmp is not on cvcpkg) and Intel TBB are off; upstream's portable build
      leaves TBB out as well. UPnP port mapping (miniupnpc) and GeoIP (libmaxminddb) are on.
      LevelDB comes from cvcpkg's leveldb, built with Snappy (cvcpkg's snappy) since 1.23+cvc.2, so a
      hash database copied from another install, with Snappy-compressed blocks, reads as it is.
  - title: "Platforms"
    description: >-
      linux-x86_64 and macos-arm64 are built, smoke-tested and packed in
      cy-pca/airdcpp-webclient's CI (.github/workflows/cvcpkg-recipe.yml): linux on
      ubuntu-22.04, for cvcpkg's glibc 2.35 floor, and macOS on macos-15 with Homebrew out of
      reach, so every dependency and tool is cvcpkg's. Upstream also builds on FreeBSD; this
      recipe does not yet. The Windows desktop client is a separate package, airdcpp-windows
      (cy-pca/airdcpp-windows).
