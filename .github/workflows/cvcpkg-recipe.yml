name: cvcpkg recipe

# Builds recipes/airdcpp-webclient as cvcpkg-publish.yml does, and throws the result away.
# `cvcpkg pack` builds it into the prefix, runs recipes/airdcpp-webclient/test.sh on the staged
# tree (the documented setup commands, then the daemon itself: its HTTP API answers with the
# version, the Web UI's index is served, SIGTERM stops it cleanly), checks its globs, relocation
# and glibc floor, and archives it. Nothing is published or uploaded.
#
# ubuntu-22.04 with GCC 12: cvcpkg's linux bundles must start on glibc 2.35, so `cvcpkg pack`
# refuses one built on a newer glibc (24.04 has 2.39), and AirDC++ needs GCC 12 or newer for C++20.
#
# macos-15 (arm64) with Apple clang: the runner image's Homebrew is taken off PATH and moved aside
# before anything is installed, as cy-pca/cvcpkg's own macOS CI does, so nothing can find its
# cmake, ninja, python, pkg-config, boost or openssl. The job fails if cmake, ninja or python
# resolve anywhere but the cvcpkg prefix, and if the packed bundle loads a library from anywhere
# but itself, its dependencies (@rpath) or macOS. test.sh then runs once more on the unpacked
# bundle with only the recipe's declared runtime dependencies beside it.
#
# Any dependency cvcpkg.org does not have yet (airdcpp-webui, merged in cy-pca/cvcpkg#630, until
# its bundle is published) is built from cy-pca/cvcpkg's recipes at CVCPKG_DEPS_REF, overlaid
# with --recipes-dir; --fallback-to-source only builds what the registry lacks. Once cvcpkg.org
# has them all, the overlay is unused and can go. Every other dependency and tool
# (cmake, ninja, python312) is installed from cvcpkg.org.
#
# GitHub-hosted runners only: this repository is public, and a pull request's workflows must
# never reach self-hosted runners.

on:
  pull_request:
    paths:
      - 'recipes/airdcpp-webclient/**'
      - '.github/workflows/cvcpkg-recipe.yml'
      - '.github/actions/**'
  push:
    branches: [master]
    paths:
      - 'recipes/airdcpp-webclient/**'
      - '.github/workflows/cvcpkg-recipe.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: cvcpkg-recipe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # cy-pca/cvcpkg master after #630 (airdcpp-webui) and #631 (snappy, leveldb with Snappy).
  CVCPKG_DEPS_REF: 65b93b80c833d7e3465c2f69fcfe2d24133cf06d
  CC: gcc-12
  CXX: g++-12

jobs:
  airdcpp-webclient:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Recipes not on cvcpkg.org yet (cy-pca/cvcpkg)
        uses: actions/checkout@v4
        with:
          repository: cy-pca/cvcpkg
          ref: ${{ env.CVCPKG_DEPS_REF }}
          path: .cvcpkg-deps
          persist-credentials: false
          sparse-checkout: |
            recipes/_common
            recipes/leveldb
            recipes/snappy
            recipes/websocketpp
            recipes/airdcpp-webui
      - uses: ./.github/actions/setup-cvcpkg
      - name: Dependencies (cvcpkg.org; the unpublished ones from source)
        run: |
          set -euo pipefail
          "$CXX" --version | head -1
          cvcpkg install-deps airdcpp-webclient \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --fallback-to-source --include-host-tools
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack airdcpp-webclient --local \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          ls dist/airdcpp-webclient-2.14.0+cvc.*-linux-x86_64-release-shared.tar.gz

  airdcpp-webclient-macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Recipes not on cvcpkg.org yet (cy-pca/cvcpkg)
        uses: actions/checkout@v4
        with:
          repository: cy-pca/cvcpkg
          ref: ${{ env.CVCPKG_DEPS_REF }}
          path: .cvcpkg-deps
          persist-credentials: false
          sparse-checkout: |
            recipes/_common
            recipes/leveldb
            recipes/snappy
            recipes/websocketpp
            recipes/airdcpp-webui
      - uses: ./.github/actions/remove-homebrew
      - uses: ./.github/actions/setup-cvcpkg
      - name: Dependencies (cvcpkg.org; the unpublished ones from source)
        run: |
          set -euo pipefail
          "$CXX" --version | head -1
          cvcpkg install-deps airdcpp-webclient \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared \
            --fallback-to-source --include-host-tools
      - uses: ./.github/actions/check-cvcpkg-tools
        with:
          prefix: ${{ runner.temp }}/prefix
      - name: Build, test and pack
        run: |
          set -euo pipefail
          cvcpkg pack airdcpp-webclient --local \
            --recipes-dir .cvcpkg-deps/recipes --recipes-dir recipes \
            --prefix "$RUNNER_TEMP/prefix" --config release --link shared --output-dir dist
          ls -l dist/
          ls dist/airdcpp-webclient-2.14.0+cvc.*-macos-arm64-release-shared.tar.*
      - uses: ./.github/actions/check-macos-bundle
        with:
          archive: dist/airdcpp-webclient-2.14.0+cvc.*-macos-arm64-release-shared.tar.*
          unpack-dir: ${{ runner.temp }}/unpacked
      # The build prefix holds every build tool's dependencies too (python312 brings iconv,
      # sqlite, ...), so test.sh passing there does not prove the recipe declares everything
      # the daemon loads. Here it runs again on the unpacked bundle with a prefix holding only
      # the recipe's macOS runtime dependencies and theirs.
      - name: Test the bundle on its declared runtime dependencies alone
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/runtime"
          deps=$(python -I -c '
          import sys, yaml
          for d in yaml.safe_load(open(sys.argv[1]))["depends"]["runtime"]:
              d = d if isinstance(d, dict) else {"name": d}
              if "macos" in d.get("platforms", ["macos"]):
                  print(d["name"])
          ' recipes/airdcpp-webclient/recipe.yaml)
          registry=""; unpublished=""
          for d in $deps; do
            if cvcpkg info "$d" >/dev/null 2>&1; then registry="$registry $d"; else unpublished="$unpublished $d"; fi
          done
          echo "from cvcpkg.org:$registry; not published yet:${unpublished:- none}"
          # shellcheck disable=SC2086
          cvcpkg install $registry --prefix "$runtime" --config release --link shared \
            --no-fallback-to-source
          # Not on cvcpkg.org yet (leveldb): its dylibs from the build prefix, by name.
          for d in $unpublished; do
            n=0
            for f in "$RUNNER_TEMP/prefix/lib/lib$d".*dylib; do
              [ -e "$f" ] || continue
              cp -a "$f" "$runtime/lib/"; n=$((n + 1))
            done
            [ "$n" -gt 0 ] || { echo "::error::no lib$d dylib in the build prefix"; exit 1; }
          done
          CVC_INSTALL_DIR="$RUNNER_TEMP/unpacked" CVC_DEPS_PREFIX="$runtime" \
            bash recipes/airdcpp-webclient/test.sh
